# Qreative fork: test, then build and publish ghcr.io/qreative-co/filebrowser.
# A tag vX.Y.Z[-pre]-qreative.N publishes ghcr.io/qreative-co/filebrowser:X.Y.Z[-pre]-qreative.N (linux/amd64).
name: qreative image

on:
  push:
    branches:
      - "qreative-main"
    tags:
      - "v*-qreative.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Go tests
        working-directory: backend
        run: go test ./... -timeout 15m

  test-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Unit tests
        working-directory: frontend
        run: npm ci && npm run test

  image:
    needs: [test-backend, test-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: _docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ghcr.io/qreative-co/filebrowser:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/qreative-co/filebrowser
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=FileBrowser Quantum (Qreative fork: must change password at first login)
      - name: Digest
        run: |
          echo "ghcr.io/qreative-co/filebrowser:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
